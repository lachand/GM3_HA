set_schedule:
  name: Set weekly schedule
  description: >
    Overwrite the comfort/eco weekly schedule for a heating circuit or the
    domestic hot water. Any time not covered by a comfort block becomes eco.
  fields:
    circuit:
      name: Circuit
      description: Heating circuit number. Leave empty to target domestic hot water.
      required: false
      selector:
        number:
          min: 1
          max: 7
          mode: box
    days:
      name: Days
      description: Which days this schedule applies to.
      required: true
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - everyday
            - weekday
            - weekend
    comfort_blocks:
      name: Comfort blocks
      description: >
        List of from/to time ranges that should be in comfort mode. An
        empty list sets the whole day to eco.
      required: false
      example: |
        - from: "06:00:00"
          to: "08:30:00"
        - from: "17:00:00"
          to: "22:00:00"
      selector:
        object:

solar_to_buffer:
  name: Solar dump to buffer
  description: >
    Put the boiler in manual mode and force the DHW pump for a set time, then
    return to automatic. Moves heat from the solar-charged DHW tank into the
    buffer tanks - e.g. run it before a forecast overcast spell. The boiler is
    always returned to automatic (on the timer, on a second call, on restart).
  fields:
    duration:
      name: Duration
      description: How long to force the pump, in minutes (capped at 120).
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
          mode: box
