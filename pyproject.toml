[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "tools/debug"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "SIM105", # contextlib.suppress over try/except/pass -- try/except reads fine here
    "B008",   # function call in argument default -- voluptuous schemas do this
    "RUF012", # HA entity classes use plain mutable class attrs by framework convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:backoff.*",
    "ignore:Inheritance class HomeAssistantApplication:DeprecationWarning",
]
